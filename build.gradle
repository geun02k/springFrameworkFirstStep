plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.study.domain'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // AOP 사용을 위한 의존성 추가
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // 스프링부트 개발도구 사용을 위한 의존성 추가
    implementation 'org.springframework.boot:spring-boot-devtools'
    // 스프링 데이터 jdbc 사용을 위한 의존성 추가
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    // mysql 사용을 위한 의존성 추가
    implementation 'com.mysql:mysql-connector-j'

    // 타임리프(템플릿엔진) 사용을 위한 의존성 추가
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // 타임리프 레이아웃 사용을 위한 의존성 추가
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    // Jakarta EE제공 Validation 검증을 위한 의존성 추가 (표준)
    implementation 'jakarta.validation:jakarta.validation-api'
    // 하이버네이트 프레임워크 제공 Validation 검증을 위한 의존성 추가 (확장)
    implementation 'org.hibernate.validator:hibernate-validator'

    // lombok 사용을 위한 의존성 추가
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
