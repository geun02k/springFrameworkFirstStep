<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>use fragment</title>
</head>
<body>
  <h1>Fragment 사용하기</h1>
  <h2>fragment를 아래에 삽입합니다.</h2>
  <div>insert의 경우 삽입되는 해당 태그 안에 fragment 내용 삽입됨.</div>
  <div>replace의 경우 삽입되는 해당 태그 대신 fragment 내용 출력됨.</div>
  <div id="one" th:insert="fragment :: one"></div>
  <div id="three" th:replace="fragment :: three"></div>
</body>
</html>
