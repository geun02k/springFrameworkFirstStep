<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf Sample</title>
</head>
<body>
    <!-- 직접 문자 삽입 -->
    <h3 th:text="'hello world!'">직접 문자열 삽입해 표시하는 부분</h3>
    <!-- 인라인 처리 -->
    <h3>안녕하세요! [[${name}]]님</h3>
    <!-- 값 결합 -->
    <h3 th:text="'오늘의 날씨는' + ' 맑음 ' + '입니다.'">문자열 결합해 표시하는 부분</h3>

    <hr>
    <!-- 값 결합(리터럴 치환) -->
    <h3 th:text="|안녕하세요, ${name}씨|">리터럴 치환으로 문자열 결합해 표시하는 부분</h3>
    <!-- 지역변수 -->
    <div th:with="a=1, b=2">
        <span th:text="|${a} + ${b} = ${a+b}|"></span>
    </div>
    <!-- 비교와 등가 -->
    <div>
        <span th:text="1 > 10">false</span>
        <span th:text="1 < 10">true</span>
        <span th:text="1 >= 10">false</span>
        <span th:text="1 <= 10">true</span>
        <span th:text="1 == 10">false</span>
        <span th:text="1 != 10">true</span>
        <span th:text="길동 == 길동">true</span>
        <span th:text="길동 != 길동">false</span>
    </div>

    <hr>
    <!-- 조건연산자 -->
    <p th:text="${name} == '이순신' ? '이순신입니다!' : '이순신이 아닙니다.'"></p>
    <!-- 조건분기 - 조건절이 true일 때 출력 -->
    <div th:if="${name} == '이순신'">
        <p>이순신씨입니다!!</p>
    </div>
    <!-- 조건분기 - 조건절이 false일 때 출력 -->
    <div th:unless="${name} == '김영희'">
        <p>김영희씨가 아닙니다.</p>
    </div>
</body>
</html>
