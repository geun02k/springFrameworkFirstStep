<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OX 퀴즈 애플리케이션 : CRUD</title>
</head>
<body>
    <h1>OX 퀴즈 애플리케이션 : CRUD</h1>
    <h3 th:text="${title}">제목</h3>

    <!-- 등록, 변경 완료 메시지 -->
    <p th:if="${complete}" th:text="${complete}" style="color:blue">등록, 변경 완료 메시지</p>

    <form method="post"
          th:action="${quizForm.newQuiz} ? @{/quiz/insert} : @{/quiz/update}"
          th:object="${quizForm}">

        <label >퀴즈내용 </label><br>
        <textarea rows="5" cols="50" th:field="*{question}"></textarea>
        <br>
        <div th:if="${#fields.hasErrors('question')}" th:errors="*{question}" style="color: red"></div>

        <label>퀴즈정답 </label><br>
        <input type="radio" value="true" th:field="*{answer}"> O
        <input type="radio" value="false" th:field="*{answer}"> X
        <br>
        <div th:if="${#fields.hasErrors('answer')}" th:errors="*{answer}" style="color: red"></div>

        <label>작성자 </label><br>
        <input type="text" th:field="*{author}">
        <br>
        <div th:if="${#fields.hasErrors('author')}" th:errors="*{author}" style="color: red"></div>

        <input th:if="${id}" type="hidden" th:field="*{id}">

        <br>
        <input type="submit" value="저장">
        <br>
    </form>
    <hr>

    <!-- 신규 등록시에만 표시 -->
    <div th:if="${quizForm.newQuiz}" style="margin: 10px">
        <h3>등록된 퀴즈 목록 - <a th:href="@{/quiz/play}">플레이</a></h3>

        <!-- 삭제 완료 메시지 -->
        <p th:if="${delcomplete}" th:text="${delcomplete}" style="color: blue"></p>
        <p th:if="${msg}" th:text="${msg}" style="color: red"></p>

        <!-- 퀴즈 존재 시 출력 -->
        <table th:unless="${#lists.isEmpty(quizList)}"
               border="1" style="table-layout: fixed">
            <tr>
                <th>ID</th>
                <th>내용</th>
                <th>정답</th>
                <th>작성자</th>
                <th>변경</th>
                <th>삭제</th>
            </tr>
            <tr th:each="obj:${quizList}" align="center">
                <td th:text="${obj.id}"></td>
                <td th:text="${obj.question}" align="left"></td>
                <td th:text="${obj.answer} == true ? 'O' : 'X'"></td>
                <td th:text="${obj.author}"></td>
                <td>
                    <!-- @{/quiz/{id}(id=${quiz.id})}
                         : URL 경로 안에 {}로 감싼 변수 끝에 ()를 사용해 값 대입 -->
                    <form method="GET" th:action="@{/quiz/{id}(id=${obj.id})}">
                        <input type="submit" value="변경">
                    </form>
                </td>
                <td>
                    <form method="POST" th:action="@{/quiz/delete}">
                        <input type="hidden" name="id" th:value="${obj.id}">
                        <input type="submit" value="삭제">
                    </form>
                </td>
            </tr>
        </table>

        <!-- 퀴즈 미존재 시 출력 -->
        <p th:if="${#lists.isEmpty(quizList)}">등록된 퀴즈가 없습니다.</p>
    </div>

    <!-- 신규 등록 시 출력 -->
    <p th:unless="${quizForm.newQuiz}">
        <a href="#" th:href="@{/quiz}">CRUD 화면에 돌아가기</a>
    </p>
</body>
</html>
