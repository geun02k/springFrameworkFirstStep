<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Model을 이용한 확인화면</title>
</head>
<body>
    <h1>@RequestParam을 이용해 데이터 입력받아 Model을 이용해 출력하기</h1>
    <ul>
        <!-- 고정값과 변수의 조합 -> [[${변수명}]] 이용해 데이터 출력 -->
        <li>이름 : [[${name}]]</li>
        <li>나이 : [[${age}]]</li>
        <li>생년월일 : [[${birth}]]</li>
    </ul>
</body>
</html>
